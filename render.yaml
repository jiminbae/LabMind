services:
  - type: web
    name: labmind-reagent-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LABMIND_VISION_MODE
        value: manual
      - key: LABMIND_PROVIDER
        value: gemini
